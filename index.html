<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="images/favicon-32x32.png" />
    <title>Gabrielle Essence Eau De Parfum</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page">
        <article class="card" aria-labelledby="product-title">
            <picture class="card__media">
                <source media="(min-width: 768px)" srcset="images/image-product-desktop.jpg" />
                <img class="card__image" src="images/image-product-mobile.jpg"
                    alt="A bottle of Gabrielle Essence Eau De Parfum surrounded by green leaves" />
            </picture>

            <div class="card__content">
                <p class="card__category">Perfume</p>

                <h1 class="card__title" id="product-title">
                    Gabrielle Essence Eau De Parfum
                </h1>

                <p class="card__description">
                    A floral, solar and voluptuous interpretation composed by Olivier
                    Polge, Perfumer-Creator for the House of CHANEL.
                </p>

                <div class="card__pricing" aria-label="Price information">
                    <p class="card__price">$149.99</p>
                    <p class="card__price card__price--old">$169.99</p>
                </div>

                <button class="card__button" type="button">
                    <span class="card__button-icon" aria-hidden="true"><img src="images/icon-cart.svg" alt=""
                            srcset=""></span>
                    <span>Add to Cart</span>
                </button>
            </div>
        </article>
    </main>
</body>

</html>
